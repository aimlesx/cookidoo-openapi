  "/search/api/{lang}/search":
    get:
      tags:
      - Search
      summary: Search recipes and collections
      description: |-
        Advertised legacy API route. The current web search uses a different
        client-side search backend. A public synthetic miss confirmed a JSON
        object with a `data` array, while result items, filters, and pagination
        remain partial. `filters*` is modeled as an exploded map because the RFC
        6570 template does not advertise repeated `filters=` array values.
      operationId: search
      parameters:
      - "$ref": "#/components/parameters/Lang"
      - name: query
        in: query
        schema:
          type: string
      - name: context
        in: query
        schema:
          type: string
      - name: filters
        in: query
        description: Exploded service-specific filter map; value grammar is not verified.
        schema:
          "$ref": "#/components/schemas/SearchFilters"
        style: form
        explode: true
      - name: focus
        in: query
        schema:
          type: string
      - name: pagination
        in: query
        description: Opaque scalar; page-number versus cursor semantics are unverified.
        schema:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
      - name: limit
        in: query
        description: Opaque scalar advertised by the URI template; range and unit are unverified.
        schema:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
      responses:
        '200':
          description: Search result envelope with partially known items.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchResultResponse"
        '401':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
      security: []
      x-cookidoo:
        status: observed
        lastVerified: '2026-08-17'
        market: pl
        evidence:
        - source: public-discovery-2026-08-16
          supports:
          - path
        - source: public-live-reads-2026-08-17
          supports:
