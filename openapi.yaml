openapi: 3.1.1
info:
  title: Cookidoo Web API (Unofficial)
  version: 0.2.0
  summary: Observed Cookidoo web API surface for the Polish market.
  description: |-
    Independently authored, unofficial research specification. Cookidoo does not
    publish or support this as a public developer API. Operations marked
    `advertised-only` may have an inferred method or an incomplete payload.

    Use only with accounts and data you are authorized to access. Public
    availability of an endpoint is not permission to call it. Never enter live
    credentials or session cookies into hosted documentation, generators, issue
    reports, or other third-party tools.
  termsOfService: https://cookidoo.pl/consent/web/documents/pl-PL/latest/tos
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://cookidoo.pl
  description: Polish Cookidoo market gateway; other markets are unverified.
tags:
- name: Recipes
- name: Search
- name: Created recipes
- name: Organize
- name: Planning
- name: Shopping
- name: Notes
- name: Ratings
- name: Profile
- name: Devices
- name: Ownership
- name: Feeds
x-cookidoo-authentication:
  status: partial
  documentation: docs/authentication.md
  evidence:
  - source: oidc-discovery-2026-08-16
    supports:
    - oidc-capabilities
  - source: external-clients-2026-08-17
    supports:
    - redirect-flow
    - cookie-session
  - source: authenticated-ui-2026-08-17
    supports:
    - form-behavior
    - csrf-observations
  loginEntryPoint: "/profile/{lang}/login"
  redirectParameter: redirectAfterLogin
  oidcDiscovery: https://ciam.prod.cookidoo.vorwerk-digital.com/.well-known/openid-configuration
  firstPartyFlow:
    protocol: authorization-code
    pkce: corroborated
    browserRedirects: true
    loginForm:
      action: dynamic-first-party-action
      contentType: application/x-www-form-urlencoded
      fields:
      - requestId
      - username
      - password
    callback: /oauth2/callback
  marketApiSession:
    mechanism: cookie-jar
    completeCookieSet: unknown
    knownSessionCookie: _oauth2_proxy
    uiMarkerCookie: v-authenticated
  logout:
    uiEntryPoint: /profile/logout
    completeSequence: unknown
  csrf:
    genericRule: unknown
    xRequestedWith: observed-ajax-marker
    inspectedGeneralFormsToken: not-observed
    originOrRefererEnforcement: unknown
    consentSpecificRule:
      cookie: csrf_
      header: X-Csrf-Token
      generalizable: false
x-cookidoo-protocol-behavior:
  status: partial
  documentation: docs/protocol-behavior.md
  idempotencyKey: not-observed
  automaticMutationRetries: unsafe-without-reconciliation
  publishedRateLimit: unknown
  retryAfter: optional-when-present
  conditionalWrites: not-observed
  concurrencyGuarantee: unknown
paths:
  "/recipes/recipe/{lang}/{recipeId}":
    get:
      tags:
      - Recipes
      summary: Get an official recipe
      operationId: getRecipe
      parameters:
      - "$ref": "#/components/parameters/Lang"
      - "$ref": "#/components/parameters/RecipeId"
      responses:
        '200':
          description: Full recipe representation; exact fields vary by recipe and
            device generation.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OfficialRecipe"
        '401':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
      security: []
      x-cookidoo:
        status: corroborated
        lastVerified: '2026-08-17'
        market: pl
        evidence:
        - source: external-clients-2026-08-16
          supports:
          - path
          - method
          - authentication
          - request
          - response
        - source: public-live-reads-2026-08-17
          supports:
          - path
          - method
          - authentication
          - response
        responseShape: typed
        risk:
          effect: read
          destructive: false
          externallyVisible: false
          exercised: false
  "/recipes/cluster/{clusterId}":
    get:
      tags:
      - Recipes
      summary: Get variants in a recipe cluster
      description: |-
        Legacy compatibility route advertised by HAL discovery. A public
        synthetic miss confirmed an unauthenticated JSON array response. A
        low-volume public read of a non-empty cluster linked from an official
        recipe confirmed the modeled core item fields; other cluster variants
        and optional fields remain partial.
      operationId: getRecipeCluster
      parameters:
      - name: clusterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Recipe cluster array with observed core item fields; additional variants remain partial.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RecipeClusterV1Response"
        '401':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
      security: []
      x-cookidoo:
        status: observed
        lastVerified: '2026-08-17'
        market: pl
        evidence:
        - source: public-discovery-2026-08-16
          supports:
          - path
        - source: public-live-reads-2026-08-17
          supports:
          - path
          - method
          - authentication
          - response
        responseShape: partial
        authentication: not-required-for-observed-read
        risk:
          effect: read
          destructive: false
          externallyVisible: false
          exercised: false
