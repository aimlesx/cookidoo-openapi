components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
      description: |-
        Partial representation of the first-party browser session. A current
        client also preserves `v-authenticated`, but that client-readable marker
        is not treated as an authentication credential. The complete cookie jar,
        attributes, renewal, and CSRF requirements remain unknown. Never paste
        live values into hosted documentation, generators, issues, or third-party
        tools.
    basicAuth:
      type: http
      scheme: basic
      description: Authentication declared by the advertised collection-feed specification;
        credentials are not documented here.
  parameters:
    Lang:
      name: lang
      in: path
      required: true
      schema:
        type: string
        default: pl
        pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        pattern: "^r[0-9]+$"
    AnyRecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
    CustomerRecipeId:
      name: customerRecipeId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/CustomerRecipeId"
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
    DayKey:
      name: dayKey
      in: path
      required: true
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: false
      description: |-
        Marker added by the current first-party AJAX form helper. It is not proof
        that CSRF requirements have been satisfied.
      schema:
        type: string
        default: xmlhttprequest
  requestBodies:
    RecipeIdBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - recipeId
            properties:
              recipeId:
                type: string
            additionalProperties: false
          example:
            recipeId: r123456
    RecipeIdsAddBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - recipeIDs
            properties:
              recipeIDs:
                type: array
                items:
                  oneOf:
                  - type: string
                  - type: object
                    required:
                    - id
                    - source
                    properties:
                      id:
                        type: string
                      source:
                        type: string
                        const: CUSTOMER
                    additionalProperties: false
                minItems: 1
            additionalProperties: false
          example:
            recipeIDs:
            - r123456
    RecipeIdsRemoveBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - recipeIDs
            additionalProperties: false
            properties:
              recipeIDs:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
          example:
            recipeIDs:
            - r123456
  headers:
    RetryAfter:
      description: |-
        Server-requested delay when present. Absence does not imply that an
        immediate retry is safe, especially for mutations with an ambiguous
        outcome.
      schema:
        oneOf:
        - type: integer
          minimum: 0
          description: Delay in seconds.
        - type: string
          description: HTTP-date.
  responses:
    EmptySuccess:
      description: Successful response with no required body.
    Error:
      description: Error response. The gateway may return JSON problem details or
        HTML.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Problem"
        text/html:
          schema:
            type: string
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            status: 400
            title: Synthetic error
    UnknownJsonSuccess:
      description: Successful JSON response whose top-level shape has not been safely
        verified.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UnknownJson"
  schemas:
    CustomerRecipeId:
      type: string
      description: ULID generated for a customer-created recipe.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    OpaqueQueryScalar:
      description: Scalar URI-template value whose concrete type is not verified.
      oneOf:
      - type: string
      - type: number
      - type: boolean
    SearchFilters:
      type: object
      description: |-
        Form-exploded filter map. Named properties come from advertised search
        links; value delimiters, repetition, enums, units, and ranges remain
        unverified.
      properties:
        tags:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        categories:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        ratings:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        preparationTime:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        portions:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        difficulty:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        totalTime:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        tmv:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        countries:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        languages:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        additionalDevices:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        accessories:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        sortby:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        ids:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        ingredients:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        excludeIngredients:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        excludeTags:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        exclude:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
        like:
          "$ref": "#/components/schemas/OpaqueQueryScalar"
      additionalProperties:
        "$ref": "#/components/schemas/OpaqueQueryScalar"
    RecipeClusterEntryV1:
      type: object
