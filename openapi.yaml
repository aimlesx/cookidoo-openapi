components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: _oauth2_proxy
      description: |-
        Partial representation of the first-party browser session. Additional cookies
        or CSRF protections may be required. Never paste live cookie values into
        hosted documentation, generators, issues, or third-party tools.
    basicAuth:
      type: http
      scheme: basic
      description: Authentication declared by the advertised collection-feed specification;
        credentials are not documented here.
  parameters:
    Lang:
      name: lang
      in: path
      required: true
      schema:
        type: string
        default: pl
        pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        pattern: "^r[0-9]+$"
    AnyRecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
    CustomerRecipeId:
      name: customerRecipeId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/CustomerRecipeId"
    ListId:
      name: listId
      in: path
      required: true
      schema:
        type: string
    DayKey:
      name: dayKey
      in: path
      required: true
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: false
      schema:
        type: string
        default: xmlhttprequest
  requestBodies:
    RecipeIdBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - recipeId
            properties:
              recipeId:
                type: string
            additionalProperties: false
          example:
            recipeId: r123456
    RecipeIdsAddBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - recipeIDs
            properties:
              recipeIDs:
                type: array
                items:
                  oneOf:
                  - type: string
                  - type: object
                    required:
                    - id
                    - source
                    properties:
                      id:
                        type: string
                      source:
                        type: string
                        const: CUSTOMER
                    additionalProperties: false
                minItems: 1
            additionalProperties: false
          example:
            recipeIDs:
            - r123456
    RecipeIdsRemoveBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - recipeIDs
            additionalProperties: false
            properties:
              recipeIDs:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
          example:
            recipeIDs:
            - r123456
  responses:
    EmptySuccess:
      description: Successful response with no required body.
    Error:
      description: Error response. The gateway may return JSON problem details or
        HTML.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Problem"
        text/html:
          schema:
            type: string
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
          example:
            status: 400
            title: Synthetic error
    UnknownJsonSuccess:
      description: Successful JSON response whose top-level shape has not been safely
        verified.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UnknownJson"
  schemas:
    CustomerRecipeId:
      type: string
      description: ULID generated for a customer-created recipe.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    OfficialRecipe:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        recipeIngredientGroups:
          type: array
          items:
            type: object
      example:
        id: r123456
        name: Synthetic recipe
        recipeIngredientGroups: []
    CreateBlankRecipe:
      type: object
      required:
      - recipeName
      properties:
        recipeName:
          type: string
          minLength: 1
          maxLength: 120
      additionalProperties: false
      example:
        recipeName: Synthetic recipe
    CopyRecipe:
      type: object
      required:
      - recipeUrl
      properties:
        recipeUrl:
          type: string
          format: uri
        servingSize:
          type: number
          exclusiveMinimum: 0
        partnerId:
          type: string
      additionalProperties: false
      example:
        recipeUrl: https://example.invalid/synthetic-recipe
    CreatedRecipe:
      type: object
      required:
      - recipeId
      - recipeContent
      additionalProperties: true
      properties:
        recipeId:
          "$ref": "#/components/schemas/CustomerRecipeId"
        authorId:
          type: string
        parentRecipeId:
          type: string
        status:
          type: string
        workStatus:
          type: string
          enum:
          - PRIVATE
          - PUBLIC
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        recipeContent:
          "$ref": "#/components/schemas/RecipeContent"
      example:
        recipeId: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        status: PRIVATE
        workStatus: PRIVATE
        recipeContent:
          name: Synthetic recipe
    RecipeContent:
      type: object
      required:
      - name
      additionalProperties: true
      properties:
        name:
          type: string
          maxLength: 120
        image:
          type:
          - string
          - 'null'
        ingredients:
          type: array
          items:
            "$ref": "#/components/schemas/Ingredient"
        instructions:
          type: array
          items:
            "$ref": "#/components/schemas/Instruction"
        tools:
          type: array
          items:
            type: string
        yield:
          "$ref": "#/components/schemas/RecipeYield"
        prepTime:
          type: integer
          minimum: 0
          description: Seconds
        totalTime:
          type: integer
          minimum: 0
          description: Seconds
        hints: {}
        recipeMetadata:
          type: object
          additionalProperties: true
    CreatedRecipePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        hints: {}
        image:
          type:
          - string
          - 'null'
        isImageOwnedByUser:
          type: boolean
        isImageCopyrightOwned:
          type: boolean
        ingredients:
          type: array
          items:
            "$ref": "#/components/schemas/Ingredient"
        instructions:
          type: array
          items:
            "$ref": "#/components/schemas/Instruction"
        tools:
          type: array
          items:
            type: string
        yield:
          "$ref": "#/components/schemas/RecipeYield"
        prepTime:
          type: integer
          minimum: 0
        totalTime:
          type: integer
          minimum: 0
        workStatus:
          type: string
          enum:
          - PRIVATE
          - PUBLIC
        recipeMetadata:
          type: object
          additionalProperties: true
      example:
        name: Synthetic recipe updated
    RecipeYield:
      type:
      - object
      - 'null'
      properties:
        value:
          type: number
        unitText:
          type: string
    Ingredient:
      type: object
      required:
      - type
      - text
      properties:
        type:
          type: string
          const: INGREDIENT
        text:
          type: string
    Instruction:
      type: object
      required:
      - type
      - text
      additionalProperties: true
      properties:
        type:
          type: string
          const: STEP
        text:
          type: string
        annotations:
          type: array
          items:
            type: object
            additionalProperties: true
        missedUsages:
          type: array
          items: {}
    MoveRecipe:
      type: object
      required:
      - recipeId
      - targetListId
      - srcListId
      - targetListType
      - srcListType
      properties:
        recipeId:
          type: string
        targetListId:
          type: string
        srcListId:
          type: string
        targetListType:
          type: string
        srcListType:
          type: string
      additionalProperties: false
      example:
        recipeId: r123456
        targetListId: synthetic-target-list
        srcListId: synthetic-source-list
        targetListType: CUSTOM
        srcListType: CUSTOM
    AddRecipesToDay:
      type: object
      required:
      - recipeIds
      - dayKey
      properties:
        recipeIds:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
        dayKey:
          type: string
          format: date
        recipeSource:
          type: string
          enum:
          - CUSTOMER
      additionalProperties: false
      example:
        recipeIds:
        - r123456
        dayKey: '2026-01-15'
    OwnedItemPatch:
      type: object
      required:
      - id
      - isOwned
      properties:
        id:
          type: string
        isOwned:
          type: boolean
        ownedTimestamp:
          type: integer
          description: Unix timestamp in seconds.
      additionalProperties: false
      example:
        id: synthetic-item-id
        isOwned: true
    Problem:
      type: object
      additionalProperties: true
      properties:
        status:
          type: integer
        statusCode:
          type: integer
        error:
          type: string
        title:
          type: string
        message:
          type: string
        detail:
          type: string
      example:
        status: 400
        title: Synthetic error
    UnknownJson:
      description: Deliberately unconstrained JSON. No object shape is asserted.
    FeedLimit:
      type: string
      enum:
      - small
      - medium
      - large
      default: medium
    FeedBootstrap:
      type: object
      additionalProperties: true
      description: Partial independently expressed collection bootstrap shape.
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/UnknownJson"
        _links:
          type: object
          additionalProperties: true
      example:
        items: []
        _links: {}
    FeedPage:
      type: object
      additionalProperties: true
      description: Partial independently expressed collection feed page shape.
      properties:
        lastItemULID:
          "$ref": "#/components/schemas/CustomerRecipeId"
        items:
          type: array
          items:
            "$ref": "#/components/schemas/UnknownJson"
        _links:
          type: object
          additionalProperties: true
      example:
        lastItemULID: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        items: []
        _links: {}
