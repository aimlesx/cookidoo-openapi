openapi: 3.1.1
info:
  title: Cookidoo Web API (Unofficial)
  version: 0.1.0
  summary: Observed Cookidoo web API surface for the Polish market.
  description: |-
    Independently authored, unofficial research specification. Cookidoo does not
    publish or support this as a public developer API. Operations marked
    `advertised-only` may have an inferred method or an incomplete payload.

    Use only with accounts and data you are authorized to access. Public
    availability of an endpoint is not permission to call it. Never enter live
    credentials or session cookies into hosted documentation, generators, issue
    reports, or other third-party tools.
  termsOfService: https://cookidoo.pl/consent/web/documents/pl-PL/latest/tos
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://cookidoo.pl
  description: Polish Cookidoo market gateway; other markets are unverified.
tags:
- name: Recipes
- name: Search
- name: Created recipes
- name: Organize
- name: Planning
- name: Shopping
- name: Notes
- name: Ratings
- name: Profile
- name: Devices
- name: Ownership
- name: Feeds
paths:
  "/recipes/recipe/{lang}/{recipeId}":
    get:
      tags:
      - Recipes
      summary: Get an official recipe
      operationId: getRecipe
      parameters:
      - "$ref": "#/components/parameters/Lang"
      - "$ref": "#/components/parameters/RecipeId"
      responses:
        '200':
          description: Full recipe representation; exact fields vary by recipe and
            device generation.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OfficialRecipe"
        '401':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
      security:
      - cookieSession: []
      x-cookidoo:
        status: corroborated
        lastVerified: '2026-08-16'
        market: pl
        evidence:
        - source: external-clients-2026-08-16
          supports:
          - path
          - method
          - authentication
          - request
          - response
        responseShape: typed
        risk:
          effect: read
          destructive: false
          externallyVisible: false
          exercised: false
  "/recipes/cluster/{clusterId}":
